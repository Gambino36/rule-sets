name: Сортировка и компиляция gambino-proxy

on:
  push:
    branches: [master]
    paths:
      - mihomo/gambino-proxy.yaml
      - .github/workflows/compile-gambino-mrs.yml
  pull_request:
    branches: [master]
    paths:
      - mihomo/gambino-proxy.yaml
      - .github/workflows/compile-gambino-mrs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proxy: ${{ steps.route.outputs.proxy }}
    steps:
      - name: Check out event history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether proxy YAML changed
        id: route
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          event_name = os.environ['GITHUB_EVENT_NAME']
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as source:
              event = json.load(source)
          proxy = False
          path = 'mihomo/gambino-proxy.yaml'
          if event_name in ('push', 'pull_request'):
              if event_name == 'push':
                  before, after = event['before'], event['after']
                  if set(before) == {'0'}:
                      before = git('hash-object', '-w', '-t', 'tree', '/dev/null')
              elif event.get('action') == 'synchronize' and event.get('before') and event.get('after'):
                  before, after = event['before'], event['after']
              else:
                  before = event['pull_request']['base']['sha']
                  after = event['pull_request']['head']['sha']
                  before = git('merge-base', before, after)
              status = subprocess.run(['git', 'diff', '--quiet', before, after, '--', path]).returncode
              if status not in (0, 1):
                  raise SystemExit('Could not compare proxy YAML revisions')
              proxy = status == 1
          elif event_name == 'workflow_dispatch':
              history = git('log', '-1', '--format=%H%n%B', '--extended-regexp',
                            '--grep=^Proxy-Source: [0-9a-f]{40,64}$')
              previous = re.search(r'^Proxy-Source: ([0-9a-f]{40,64})$', history, re.MULTILINE)
              if previous:
                  validated = previous[1]
                  recorded = git('rev-parse', f'{history.splitlines()[0]}:{path}')
                  if recorded != validated:
                      raise SystemExit('The recorded proxy source does not match its validated revision')
              else:
                  commit = git('log', '-1', '--format=%H', '--', 'mihomo/gambino-proxy.mrs')
                  validated = git('rev-parse', f'{commit}:{path}') if commit else ''
              proxy = git('rev-parse', f'HEAD:{path}') != validated
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'proxy={str(proxy).lower()}\n')
          print(f'Proxy YAML changed: {proxy}.')
          PY

  convert:
    needs: route
    if: needs.route.outputs.proxy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: proxy-mrs-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    env:
      MIHOMO_VERSION: v1.19.32
      MIHOMO_SHA256: 306f81e723e60ce6b828899a6fe83e1d00e9ecefb2dc8d4d849312a5bc00efdc
    steps:
      - name: Check out rules
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python and cache pip packages
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/compile-gambino-mrs.yml

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'

      - name: Normalize domain syntax, remove exact duplicates and sort YAML
        shell: bash
        run: |
          python - <<'PY'
          import ipaddress
          import re
          from pathlib import Path
          import yaml

          class UniqueKeyLoader(yaml.SafeLoader):
              def construct_mapping(self, node, deep=False):
                  self.flatten_mapping(node)
                  mapping = {}
                  for key_node, value_node in node.value:
                      key = self.construct_object(key_node, deep=deep)
                      if key in mapping:
                          raise ValueError(f'Duplicate YAML key: {key!r}')
                      mapping[key] = self.construct_object(value_node, deep=deep)
                  return mapping

          def normalize_domain(rule, shorthand=False):
              if not isinstance(rule, str) or '\n' in rule or '\r' in rule:
                  raise ValueError('Domain rules must be single-line strings.')
              domain = rule.strip().lower().removesuffix('.')
              labels = domain.split('.')
              if labels[0] in ('', '+'):
                  labels = labels[1:]
              if not labels or len('.'.join(labels).encode('utf-8')) > 253 or any(
                  not label or len(label.encode('utf-8')) > 63
                  or (label != '*' and (
                      not re.fullmatch(r'[\w-]+', label)
                      or label.startswith('-') or label.endswith('-')
                  )) for label in labels
              ):
                  raise ValueError(f'Invalid domain pattern: {rule!r}')
              try:
                  ipaddress.ip_address('.'.join(labels))
              except ValueError:
                  pass
              else:
                  raise ValueError(f'Expected a domain, not an IP address: {rule!r}')
              if shorthand:
                  if '.' not in domain:
                      raise ValueError(f'Cannot repair an ambiguous standalone value: {rule!r}')
                  if not domain.startswith(('+.', '.')) and '*' not in labels:
                      domain = '+.' + domain
              return domain

          source = Path('mihomo/gambino-proxy.yaml')
          original = source.read_text(encoding='utf-8-sig')
          lines = []
          in_payload = False
          repaired = 0
          for number, line in enumerate(original.splitlines(), 1):
              value = line.strip()
              if re.fullmatch(r'payload\s*:\s*(?:#.*)?', value):
                  in_payload = True
              elif in_payload and value and not value.startswith(('-', '#')):
                  try:
                      value = re.sub(r'\s+#.*$', '', value) if value.startswith('*.') else yaml.load(value, Loader=UniqueKeyLoader)
                      domain = normalize_domain(value, shorthand=True)
                  except (ValueError, TypeError, yaml.YAMLError) as error:
                      raise SystemExit(f'{source}:{number}: {error}') from error
                  line = '  ' + yaml.safe_dump([domain], allow_unicode=True, width=4096).rstrip('\n')
                  repaired += 1
              lines.append(line)

          data = yaml.load('\n'.join(lines) + '\n', Loader=UniqueKeyLoader)
          if not isinstance(data, dict) or set(data) != {'payload'} or not isinstance(data['payload'], list):
              raise SystemExit('YAML must contain only a payload list.')
          rules = data['payload']
          if not rules:
              raise SystemExit('The payload list must not be empty.')

          cleaned = sorted({normalize_domain(rule) for rule in rules})
          if repaired or rules != cleaned:
              class IndentedSafeDumper(yaml.SafeDumper):
                  def increase_indent(self, flow=False, indentless=False):
                      return super().increase_indent(flow, False)

              data['payload'] = cleaned
              source.write_text(
                  yaml.dump(data, Dumper=IndentedSafeDumper, sort_keys=False,
                            allow_unicode=True, default_flow_style=False),
                  encoding='utf-8',
              )
          print(f'Repaired {repaired} standalone domain line(s); removed '
                f'{len(rules) - len(cleaned)} exact duplicate(s); sorted {len(cleaned)} rules A to Z.')
          PY

      - name: Save normalized and sorted YAML immediately
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git add -- mihomo/gambino-proxy.yaml
          if git diff --cached --quiet -- mihomo/gambino-proxy.yaml; then
            exit 0
          fi
          base="$(git rev-parse HEAD)"
          git config user.name 'Gambino36'
          git config user.email '161187558+Gambino36@users.noreply.github.com'
          git commit -m "Normalize, deduplicate and sort proxy domain rules"
          for attempt in {1..10}; do
            if git fetch origin master; then
              if git merge-base --is-ancestor HEAD origin/master; then
                git merge --ff-only origin/master
                exit 0
              fi
              if ! git diff --quiet "${base}" origin/master -- mihomo/gambino-proxy.yaml; then
                echo '::error::Proxy YAML changed during cleanup; the newer update will build it.'
                exit 1
              fi
              git rebase origin/master
              if git push origin HEAD:master; then
                exit 0
              fi
            fi
            if (( attempt < 10 )); then
              echo "Retrying proxy cleanup after a network failure (${attempt}/10)."
              sleep "$(( attempt < 5 ? attempt : 5 ))"
            fi
          done
          echo '::error::Could not publish proxy cleanup after ten attempts.'
          exit 1

      - name: Start five-minute wait after the sorted YAML is saved
        id: delay
        shell: bash
        run: echo "deadline=$(( $(date +%s) + 300 ))" >> "${GITHUB_OUTPUT}"

      - name: Restore cached mihomo archive
        id: mihomo-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/mihomo.gz
          key: mihomo-${{ runner.os }}-${{ runner.arch }}-${{ env.MIHOMO_VERSION }}-${{ env.MIHOMO_SHA256 }}

      - name: Prepare verified mihomo
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/mihomo.gz"
          if [[ -f "${archive}" ]] && ! \
            printf '%s  %s\n' "${MIHOMO_SHA256}" "${archive}" | sha256sum --check --status; then
            echo 'Discarding a cached archive with an incorrect checksum.'
            rm -- "${archive}"
          fi
          if [[ ! -f "${archive}" ]]; then
            curl --fail --location --retry 3 --retry-connrefused \
              --connect-timeout 15 --max-time 60 --retry-max-time 240 \
              "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-v1-${MIHOMO_VERSION}.gz" \
              --output "${archive}"
          fi
          printf '%s  %s\n' "${MIHOMO_SHA256}" "${archive}" | sha256sum --check
          gzip --decompress --stdout "${archive}" > "${RUNNER_TEMP}/mihomo"
          chmod +x "${RUNNER_TEMP}/mihomo"

      - name: Save verified mihomo archive to cache
        if: steps.mihomo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/mihomo.gz
          key: mihomo-${{ runner.os }}-${{ runner.arch }}-${{ env.MIHOMO_VERSION }}-${{ env.MIHOMO_SHA256 }}

      - name: Wait until the five-minute deadline
        shell: bash
        env:
          BUILD_DEADLINE: ${{ steps.delay.outputs.deadline }}
        run: |
          remaining=$(( BUILD_DEADLINE - $(date +%s) ))
          if (( remaining > 0 )); then
            echo "Waiting ${remaining} seconds before converting MRS."
            sleep "${remaining}"
          fi

      - name: Check that source rules are still current
        id: current
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != 'pull_request' ]]; then
            for attempt in {1..10}; do
              if git fetch origin master; then
                break
              fi
              if (( attempt == 10 )); then
                echo '::error::Could not check current proxy rules after ten attempts.'
                exit 1
              fi
              echo "Retrying the proxy source check (${attempt}/10)."
              sleep "$(( attempt < 5 ? attempt : 5 ))"
            done
            if ! git diff --quiet HEAD origin/master -- \
              mihomo/gambino-proxy.yaml; then
              echo 'Source changed; the newer workflow run will build MRS.'
              echo 'valid=false' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            git merge --ff-only origin/master
          fi
          echo 'valid=true' >> "${GITHUB_OUTPUT}"

      - name: Convert and validate domain rules
        if: steps.current.outputs.valid == 'true'
        shell: bash
        run: |
          log="$("${RUNNER_TEMP}/mihomo" convert-ruleset domain yaml \
            mihomo/gambino-proxy.yaml mihomo/gambino-proxy.mrs 2>&1)"
          printf '%s\n' "${log}"
          if [[ "${log}" == *"skip invalid domain"* ]]; then
            echo "::error::The YAML contains invalid domain rules; MRS was not published."
            exit 1
          fi
          "${RUNNER_TEMP}/mihomo" convert-ruleset domain mrs \
            mihomo/gambino-proxy.mrs "${RUNNER_TEMP}/gambino-proxy.txt"

          python - <<'PY'
          import os
          from itertools import pairwise
          from pathlib import Path
          import yaml

          loader = getattr(yaml, 'CSafeLoader', yaml.SafeLoader)
          source_rules = yaml.load(Path('mihomo/gambino-proxy.yaml').read_text(encoding='utf-8'), Loader=loader)['payload']
          mrs_rules = (Path(os.environ['RUNNER_TEMP']) / 'gambino-proxy.txt').read_text(encoding='utf-8').splitlines()

          def check_order(rules, label):
              if not rules:
                  raise SystemExit(f'{label} contains no domain rules.')
              for previous, current in pairwise(rules):
                  if current == previous:
                      raise SystemExit(f'Exact duplicate in {label}: {current}')
                  if current < previous:
                      raise SystemExit(f'{label} is not sorted A to Z.')

          check_order(source_rules, 'source YAML')
          check_order(mrs_rules, 'MRS domain export')

          def patterns(rules):
              result = set()
              for rule in rules:
                  rule = rule.lower()
                  if rule.startswith('+.'):
                      result.update((rule[2:], rule[1:]))
                  else:
                      result.add(rule)
              return result

          if patterns(source_rules) != patterns(mrs_rules):
              raise SystemExit('MRS domain coverage differs from the source YAML.')
          print(f'Validated {len(source_rules)} unique YAML rules and {len(mrs_rules)} sorted, unique MRS rules.')
          PY

      - name: Commit updated MRS
        if: github.event_name != 'pull_request' && steps.current.outputs.valid == 'true'
        shell: bash
        run: |
          git add -- mihomo/gambino-proxy.mrs
          base="$(git rev-parse HEAD)"
          source_blob="$(git rev-parse HEAD:mihomo/gambino-proxy.yaml)"
          git config user.name 'Gambino36'
          git config user.email '161187558+Gambino36@users.noreply.github.com'
          git commit --allow-empty -m "Update gambino-proxy.mrs" -m "Proxy-Source: ${source_blob}"
          for attempt in {1..10}; do
            if git fetch origin master; then
              if git merge-base --is-ancestor HEAD origin/master; then
                git merge --ff-only origin/master
                exit 0
              fi
              if ! git diff --quiet "${base}" origin/master -- \
                mihomo/gambino-proxy.yaml mihomo/gambino-proxy.mrs; then
                echo '::error::Proxy files changed during compilation; the newer update will build them.'
                exit 1
              fi
              git rebase origin/master
              if git push origin HEAD:master; then
                exit 0
              fi
            fi
            if (( attempt < 10 )); then
              echo "Retrying proxy MRS publication after a network failure (${attempt}/10)."
              sleep "$(( attempt < 5 ? attempt : 5 ))"
            fi
          done
          echo '::error::Could not publish proxy MRS after ten attempts.'
          exit 1
