name: Компиляция MRS

on:
  # 00:20 UTC = 05:20 Asia/Yekaterinburg; the Telegram gate selects every third day.
  schedule:
    - cron: '20 0 * * *'
  push:
    branches: [master]
    paths:
      - Mihomo/gambino-proxy.yaml
      - .github/workflows/compile-mrs.yml
  pull_request:
    branches: [master]
    paths:
      - Mihomo/gambino-proxy.yaml
      - .github/workflows/compile-mrs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proxy: ${{ steps.route.outputs.proxy }}
      telegram: ${{ steps.route.outputs.telegram }}
    steps:
      - name: Check out event history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select independent rule updates
        id: route
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timezone

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          event_name = os.environ['GITHUB_EVENT_NAME']
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as source:
              event = json.load(source)
          proxy = False
          telegram = event_name == 'workflow_dispatch'
          path = 'Mihomo/gambino-proxy.yaml'
          if event_name in ('push', 'pull_request'):
              if event_name == 'push':
                  before, after = event['before'], event['after']
                  if set(before) == {'0'}:
                      before = git('hash-object', '-w', '-t', 'tree', '/dev/null')
              elif event.get('action') == 'synchronize' and event.get('before') and event.get('after'):
                  before, after = event['before'], event['after']
              else:
                  before = event['pull_request']['base']['sha']
                  after = event['pull_request']['head']['sha']
                  before = git('merge-base', before, after)
              status = subprocess.run(['git', 'diff', '--quiet', before, after, '--', path]).returncode
              if status not in (0, 1):
                  raise SystemExit('Could not compare proxy YAML revisions')
              proxy = status == 1
          elif event_name == 'workflow_dispatch':
              history = git('log', '-1', '--format=%B', '--extended-regexp',
                            '--grep=^Proxy-Source: [0-9a-f]{40,64}$')
              previous = re.search(r'^Proxy-Source: ([0-9a-f]{40,64})$', history, re.MULTILINE)
              if previous:
                  validated = previous[1]
              else:
                  commit = git('log', '-1', '--format=%H', '--', 'Mihomo/gambino-proxy.mrs')
                  validated = git('rev-parse', f'{commit}:{path}') if commit else ''
              proxy = git('rev-parse', f'HEAD:{path}') != validated
          elif event_name == 'schedule':
              epoch_day = int(datetime.now(timezone.utc).timestamp()) // 86400
              telegram = (epoch_day - 20729) % 3 == 0
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'proxy={str(proxy).lower()}\ntelegram={str(telegram).lower()}\n')
          print(f'Proxy YAML changed: {proxy}; Telegram source check due: {telegram}.')
          PY

  convert:
    needs: route
    if: needs.route.outputs.proxy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: proxy-mrs-${{ github.ref }}
      # Only a newer proxy YAML update restarts this five-minute window.
      cancel-in-progress: true
    permissions:
      contents: write
    env:
      MIHOMO_VERSION: v1.19.32
      MIHOMO_SHA256: 306f81e723e60ce6b828899a6fe83e1d00e9ecefb2dc8d4d849312a5bc00efdc
    steps:
      - name: Set five-minute conversion deadline
        id: delay
        shell: bash
        run: echo "deadline=$(( $(date +%s) + 300 ))" >> "${GITHUB_OUTPUT}"

      - name: Check out rules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python and cache pip packages
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # Hash the pinned dependency in this workflow; no requirements file needed.
          cache-dependency-path: .github/workflows/compile-mrs.yml

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'

      - name: Remove exact duplicates and sort source YAML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          source = Path('Mihomo/gambino-proxy.yaml')
          loader = getattr(yaml, 'CSafeLoader', yaml.SafeLoader)
          data = yaml.load(source.read_text(encoding='utf-8'), Loader=loader)
          if not isinstance(data, dict) or not isinstance(data.get('payload'), list):
              raise SystemExit('YAML must contain a payload list.')
          rules = data['payload']
          if not rules or any(
              not isinstance(rule, str) or not rule or rule != rule.strip()
              or '\n' in rule or '\r' in rule for rule in rules
          ):
              raise SystemExit('Domain rules must be non-empty, single-line strings without surrounding whitespace.')

          # Only equal strings are duplicates; parent and child domains remain.
          cleaned = sorted(set(rules))
          if rules != cleaned:
              class IndentedSafeDumper(yaml.SafeDumper):
                  def increase_indent(self, flow=False, indentless=False):
                      return super().increase_indent(flow, False)

              data['payload'] = cleaned
              source.write_text(
                  yaml.dump(data, Dumper=IndentedSafeDumper, sort_keys=False,
                            allow_unicode=True, default_flow_style=False),
                  encoding='utf-8',
              )
          print(f'Removed {len(rules) - len(cleaned)} exact duplicate(s); sorted {len(cleaned)} rules A to Z.')
          PY

      - name: Save cleaned and sorted YAML immediately
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git add -- Mihomo/gambino-proxy.yaml
          if git diff --cached --quiet -- Mihomo/gambino-proxy.yaml; then
            exit 0
          fi
          base="$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Deduplicate and sort proxy domain rules"
          # GITHUB_TOKEN commits do not trigger another workflow run.
          for attempt in 1 2 3; do
            git fetch origin master
            if ! git diff --quiet "${base}" origin/master -- Mihomo/gambino-proxy.yaml; then
              echo '::error::Proxy YAML changed during cleanup; the newer update will build it.'
              exit 1
            fi
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
          done
          echo '::error::Could not publish proxy cleanup after three attempts.'
          exit 1

      - name: Restore cached mihomo archive
        id: mihomo-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mihomo.gz
          key: mihomo-${{ runner.os }}-${{ runner.arch }}-${{ env.MIHOMO_VERSION }}-${{ env.MIHOMO_SHA256 }}

      - name: Prepare verified mihomo
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/mihomo.gz"
          if [[ -f "${archive}" ]] && ! \
            printf '%s  %s\n' "${MIHOMO_SHA256}" "${archive}" | sha256sum --check --status; then
            echo 'Discarding a cached archive with an incorrect checksum.'
            rm -- "${archive}"
          fi
          if [[ ! -f "${archive}" ]]; then
            curl --fail --location --retry 3 \
              "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-v1-${MIHOMO_VERSION}.gz" \
              --output "${archive}"
          fi
          printf '%s  %s\n' "${MIHOMO_SHA256}" "${archive}" | sha256sum --check
          gzip --decompress --stdout "${archive}" > "${RUNNER_TEMP}/mihomo"
          chmod +x "${RUNNER_TEMP}/mihomo"

      - name: Save verified mihomo archive to cache
        if: steps.mihomo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mihomo.gz
          key: mihomo-${{ runner.os }}-${{ runner.arch }}-${{ env.MIHOMO_VERSION }}-${{ env.MIHOMO_SHA256 }}

      - name: Wait until the five-minute deadline
        shell: bash
        env:
          BUILD_DEADLINE: ${{ steps.delay.outputs.deadline }}
        run: |
          remaining=$(( BUILD_DEADLINE - $(date +%s) ))
          if (( remaining > 0 )); then
            echo "Waiting ${remaining} seconds before converting MRS."
            sleep "${remaining}"
          fi

      - name: Check that source rules are still current
        id: current
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != 'pull_request' ]]; then
            git fetch origin master
            if ! git diff --quiet HEAD origin/master -- \
              Mihomo/gambino-proxy.yaml; then
              echo 'Source changed; the newer workflow run will build MRS.'
              echo 'valid=false' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            git merge --ff-only origin/master
          fi
          echo 'valid=true' >> "${GITHUB_OUTPUT}"

      - name: Convert and validate domain rules
        if: steps.current.outputs.valid == 'true'
        shell: bash
        run: |
          log="$("${RUNNER_TEMP}/mihomo" convert-ruleset domain yaml \
            Mihomo/gambino-proxy.yaml Mihomo/gambino-proxy.mrs 2>&1)"
          printf '%s\n' "${log}"
          if [[ "${log}" == *"skip invalid domain"* ]]; then
            echo "::error::The YAML contains invalid domain rules; MRS was not published."
            exit 1
          fi
          "${RUNNER_TEMP}/mihomo" convert-ruleset domain mrs \
            Mihomo/gambino-proxy.mrs "${RUNNER_TEMP}/gambino-proxy.txt"

          python - <<'PY'
          import os
          from itertools import pairwise
          from pathlib import Path
          import yaml

          loader = getattr(yaml, 'CSafeLoader', yaml.SafeLoader)
          source_rules = yaml.load(Path('Mihomo/gambino-proxy.yaml').read_text(encoding='utf-8'), Loader=loader)['payload']
          mrs_rules = (Path(os.environ['RUNNER_TEMP']) / 'gambino-proxy.txt').read_text(encoding='utf-8').splitlines()

          def check_order(rules, label):
              if not rules:
                  raise SystemExit(f'{label} contains no domain rules.')
              for previous, current in pairwise(rules):
                  if current == previous:
                      raise SystemExit(f'Exact duplicate in {label}: {current}')
                  if current < previous:
                      raise SystemExit(f'{label} is not sorted A to Z.')

          check_order(source_rules, 'source YAML')
          check_order(mrs_rules, 'MRS domain export')

          # Mihomo merges "domain" + ".domain" into "+.domain" and lowercases
          # domain names. Compare their component patterns to detect rule loss.
          def patterns(rules):
              result = set()
              for rule in rules:
                  rule = rule.lower()
                  if rule.startswith('+.'):
                      result.update((rule[2:], rule[1:]))
                  else:
                      result.add(rule)
              return result

          if patterns(source_rules) != patterns(mrs_rules):
              raise SystemExit('MRS domain coverage differs from the source YAML.')
          print(f'Validated {len(source_rules)} unique YAML rules and {len(mrs_rules)} sorted, unique MRS rules.')
          PY

      - name: Commit updated MRS
        if: github.event_name != 'pull_request' && steps.current.outputs.valid == 'true'
        shell: bash
        run: |
          git add -- Mihomo/gambino-proxy.mrs
          base="$(git rev-parse HEAD)"
          source_blob="$(git rev-parse HEAD:Mihomo/gambino-proxy.yaml)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m "Update gambino-proxy.mrs" -m "Proxy-Source: ${source_blob}"
          for attempt in 1 2 3; do
            git fetch origin master
            if ! git diff --quiet "${base}" origin/master -- \
              Mihomo/gambino-proxy.yaml Mihomo/gambino-proxy.mrs; then
              echo '::error::Proxy files changed during compilation; the newer update will build them.'
              exit 1
            fi
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
          done
          echo '::error::Could not publish proxy MRS after three attempts.'
          exit 1

  telegram:
    needs: route
    if: needs.route.outputs.telegram == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: telegram-ip-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      MIHOMO_VERSION: v1.19.32
      MIHOMO_SHA256: 306f81e723e60ce6b828899a6fe83e1d00e9ecefb2dc8d4d849312a5bc00efdc
    steps:
      - name: Check out rules and source fingerprints
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python for Telegram
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser for Telegram
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'

      - name: Check sources and compile changed Telegram rules
        id: telegram
        shell: bash
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          import ipaddress as ip
          import os
          import re
          import subprocess
          import time
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.request import Request, urlopen
          import yaml

          urls = (
              'https://raw.githubusercontent.com/666OS/rules/release/mihomo/ip/Telegram.txt',
              'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.list',
              'https://raw.githubusercontent.com/Davoyan/mihomo-rule-sets/main/domains/additional-telegram-ips.yaml',
          )
          sha = lambda data: hashlib.sha256(data).hexdigest()

          def fetch(url, limit=2 * 1024 * 1024):
              for attempt in range(3):
                  try:
                      with urlopen(Request(url, headers={'User-Agent': 'Telegram-IP-updater'}), timeout=30) as response:
                          if response.status != 200:
                              raise ValueError(f'Unexpected HTTP status for {url}: {response.status}')
                          data = response.read(limit + 1)
                      if not data or len(data) > limit:
                          raise ValueError(f'Empty or oversized source: {url}')
                      return data
                  except OSError:
                      if attempt == 2:
                          raise
                      time.sleep(attempt + 1)

          class Loader(yaml.SafeLoader):
              pass

          def mapping(loader, node):
              result = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node)
                  if key in result:
                      raise ValueError(f'Duplicate YAML key: {key!r}')
                  result[key] = loader.construct_object(value_node)
              return result

          Loader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, mapping)

          def parse(data, is_yaml=False):
              text = data.decode('utf-8-sig')
              if is_yaml:
                  document = yaml.load(text, Loader=Loader)
                  if not isinstance(document, dict) or set(document) != {'payload'}:
                      raise ValueError('Expected a YAML payload mapping')
                  rules = document['payload']
              else:
                  rules = [line for line in text.splitlines() if line.partition('#')[0].strip()]
              if not isinstance(rules, list) or not rules:
                  raise ValueError('Expected a non-empty rule list')
              networks = []
              for rule in rules:
                  if not isinstance(rule, str):
                      raise ValueError(f'Expected a string CIDR: {rule!r}')
                  cidr = rule.partition('#')[0].strip()
                  match = re.fullmatch(r'(IP-CIDR6|IP-CIDR)[:,](.+)', cidr)
                  if match:
                      fields = match[2].split(',')
                      if len(fields) > 2 or (len(fields) == 2 and fields[1].strip() != 'no-resolve'):
                          raise ValueError(f'Unsupported IP rule fields: {rule!r}')
                      cidr = fields[0].strip()
                  if '/' not in cidr:
                      raise ValueError(f'Expected a CIDR: {rule!r}')
                  network = ip.ip_network(cidr, strict=False)
                  if match and match[1] == 'IP-CIDR6' and network.version != 6:
                      raise ValueError(f'IP-CIDR6 requires IPv6: {rule!r}')
                  networks.append(network)
              return networks

          def ranges(networks):
              result = []
              for family in (4, 6):
                  merged = []
                  for start, end in sorted((int(n.network_address), int(n.broadcast_address))
                                           for n in networks if n.version == family):
                      if merged and start <= merged[-1][1] + 1:
                          merged[-1] = (merged[-1][0], max(end, merged[-1][1]))
                      else:
                          merged.append((start, end))
                  result.extend((family, start, end) for start, end in merged)
              return result

          with ThreadPoolExecutor(max_workers=3) as pool:
              sources = list(pool.map(fetch, urls))
          fingerprint = sha('\n'.join(f'{url} {sha(data)}' for url, data in zip(urls, sources)).encode())
          original = [n for url, data in zip(urls, sources) for n in parse(data, url.endswith('.yaml'))]
          # CIDRs overlap only by containment. Retain the widest source prefix;
          # adjacent source networks remain separate, without inventing a parent.
          networks = []
          for network in sorted(set(original), key=lambda n: (n.version, int(n.network_address), n.prefixlen)):
              if networks and network.version == networks[-1].version and network.subnet_of(networks[-1]):
                  continue
              networks.append(network)
          networks.sort(key=lambda n: (n.version, int(n.network_address), n.prefixlen), reverse=True)
          if ranges(original) != ranges(networks):
              raise ValueError('CIDR reduction changed address coverage')
          rendered = ('payload:\n' + ''.join(f'  - {n}\n' for n in networks)).encode()
          if parse(rendered, True) != networks:
              raise ValueError('Generated YAML did not preserve CIDRs')
          history = subprocess.check_output(
              ['git', 'log', '-1', '--format=%H%n%B', '--extended-regexp',
               '--grep=^Telegram-Sources: [0-9a-f]{64}$'], text=True)
          previous = re.search(r'^Telegram-Sources: ([0-9a-f]{64})$', history, re.MULTILINE)
          changed = previous is None or previous[1] != fingerprint
          tracked_yaml, tracked_mrs = Path('Mihomo/telegram-ip.yaml'), Path('Mihomo/telegram-ip.mrs')
          if not changed:
              validated_mrs = subprocess.check_output(['git', 'show', f'{history.splitlines()[0]}:Mihomo/telegram-ip.mrs'])
              if tracked_yaml.read_bytes() != rendered or not validated_mrs or tracked_mrs.read_bytes() != validated_mrs:
                  raise ValueError('Current Telegram files do not match the unchanged sources')
              print('All sources are unchanged; compilation skipped.')
          else:
              work = Path(os.environ['RUNNER_TEMP'])
              version = os.environ['MIHOMO_VERSION']
              archive = fetch(f'https://github.com/MetaCubeX/mihomo/releases/download/{version}/'
                              f'mihomo-linux-amd64-v1-{version}.gz', 64 * 1024 * 1024)
              if sha(archive) != os.environ['MIHOMO_SHA256']:
                  raise ValueError('Mihomo archive checksum mismatch')
              binary = work / 'telegram-mihomo'
              binary.write_bytes(gzip.decompress(archive))
              binary.chmod(0o755)
              source, compiled, exported = (work / f'telegram-ip.{ext}' for ext in ('yaml', 'mrs', 'txt'))
              source.write_bytes(rendered)
              for input_format, input_file, output_file in (('yaml', source, compiled), ('mrs', compiled, exported)):
                  subprocess.run([str(binary), 'convert-ruleset', 'ipcidr', input_format,
                                  str(input_file), str(output_file)], check=True, timeout=60)
              if not compiled.is_file() or not compiled.stat().st_size or ranges(parse(exported.read_bytes())) != ranges(networks):
                  raise ValueError('Compiled MRS address coverage differs from the YAML')
              tracked_yaml.write_bytes(rendered)
              tracked_mrs.write_bytes(compiled.read_bytes())
              print(f'Validated {len(original)} source entries and {len(networks)} unique non-overlapping CIDRs.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'changed={str(changed).lower()}\nfingerprint={fingerprint}\n')
          PY

      - name: Publish Telegram rules as Gambino36
        if: steps.telegram.outputs.changed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: bash
        env:
          SOURCE_FINGERPRINT: ${{ steps.telegram.outputs.fingerprint }}
        run: |
          base="$(git rev-parse HEAD)"
          git add -- Mihomo/telegram-ip.yaml Mihomo/telegram-ip.mrs
          git config user.name 'Gambino36'
          git config user.email '161187558+Gambino36@users.noreply.github.com'
          # Record raw-source changes even if they produce identical rule files.
          git commit --allow-empty -m 'Update Telegram IP rules and MRS' \
            -m "Telegram-Sources: ${SOURCE_FINGERPRINT}"
          for attempt in 1 2 3; do
            git fetch origin master
            if ! git diff --quiet "${base}" origin/master -- \
              Mihomo/telegram-ip.yaml Mihomo/telegram-ip.mrs; then
              echo '::error::Telegram files changed during compilation; rerun against the current revision.'
              exit 1
            fi
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
          done
          echo '::error::Could not publish Telegram rules after three attempts.'
          exit 1
