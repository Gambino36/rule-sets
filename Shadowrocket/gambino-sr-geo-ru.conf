# Группы настроены для работы с несколькими (многими) провайдерами. Поэтому изначально никакие прокси сервера не выбираются автоматически. Нужно зайти в группу и выбрать провайдера (или сразу нескольких) к которому будут применяться регулярные выражения, там уже выбрать желаемый сервер.
# Группа 🟢 VPN = PROXY. Сервер выбранный на главном экране Shadowrocket будет применен ко всем группам и правилами, кроме тех которые изначально настроены на работу в DIRECT.
# Группа 🎲 VPN Auto = Fallback. В группе 🟢 VPN выбирается 🎲 VPN Auto. В 🎲 VPN Auto вами выбирается желаемый сервер. Если по каким то причинам этот сервер отваливается (умирает) то Fallback группа автоматически переключит сервер на следующий живой, когда отвалившийся сервер оживает, вас вернет к выбранному изначально серверу.

[Proxy Group]
🟢 VPN = select,use=true,PROXY,🎲 VPN AUTO,🔴 Без VPN,policy-select-name=PROXY
🎲 VPN Auto Live = fallback,use=true,🟢 VPN,interval=600,timeout=5,url=http://www.gstatic.com/generate_204, policy-regex-filter=^(?=.*(?:🇦🇹\s(Austria|Австрия)|🇩🇪\s(Germany|Германия)|🇱🇻\s(Latvia|Латвия)|🇱🇹\s(Lithuania|Литва)|🇳🇱\s(Netherlands|Нидерланды)|🇵🇱\s(Poland|Польша)|🇸🇰\s(Slovakia|Словакия)|🇸🇮\s(Slovenia|Словения)|🇫🇮\s(Finland|Финляндия)|🇫🇷\s(France|Франция)|🇨🇿\s(Czech Republic|Чехия)|🇨🇭\s(Switzerland|Швейцария)|🇸🇪\s(Sweden|Швеция)|🇪🇪\s(Estonia|Эстония)))(?!.*(?i:torrent|LTE|YouTube|Обход|Белые)).*,policy-select-name=🟢 VPN
📺 Youtube = select,use=true,🔴 Без VPN,🟢 VPN,policy-regex-filter=^(?=.*(?:🇦🇹\s(Austria|Австрия)|🇩🇪\s(Germany|Германия)|🇱🇻\s(Latvia|Латвия)|🇱🇹\s(Lithuania|Литва)|🇳🇱\s(Netherlands|Нидерланды)|🇵🇱\s(Poland|Польша)|🇷🇺\s(Russia|Россия)|🇸🇰\s(Slovakia|Словакия)|🇸🇮\s(Slovenia|Словения)|🇫🇮\s(Finland|Финляндия)|🇫🇷\s(France|Франция)|🇨🇿\s(Czech Republic|Чехия)|🇨🇭\s(Switzerland|Швейцария)|🇸🇪\s(Sweden|Швеция)|🇪🇪\s(Estonia|Эстония|YouTube|🍿)))(?!.*(?i:torrent|LTE|Обход|Белые)).*,policy-select-name=🟢 VPN
🎵 Spotify = select,use=true,🔴 Без VPN,🟢 VPN,policy-regex-filter=^(?=.*(?:🇦🇹\s(Austria|Австрия)|🇩🇪\s(Germany|Германия)|🇱🇻\s(Latvia|Латвия)|🇱🇹\s(Lithuania|Литва)|🇳🇱\s(Netherlands|Нидерланды)|🇵🇱\s(Poland|Польша)|🇷🇺\s(Russia|Россия)|🇸🇰\s(Slovakia|Словакия)|🇸🇮\s(Slovenia|Словения)|🇫🇮\s(Finland|Финляндия)|🇫🇷\s(France|Франция)|🇨🇿\s(Czech Republic|Чехия)|🇨🇭\s(Switzerland|Швейцария)|🇸🇪\s(Sweden|Швеция)|🇪🇪\s(Estonia|Эстония)))(?!.*(?i:torrent|LTE|YouTube|Обход|Белые)).*,policy-select-name=🟢 VPN
💬 Telegram = select,use=true,🔴 Без VPN,🟢 VPN,policy-regex-filter=^(?=.*(?:🇦🇹\s(Austria|Австрия)|🇩🇪\s(Germany|Германия)|🇱🇻\s(Latvia|Латвия)|🇱🇹\s(Lithuania|Литва)|🇳🇱\s(Netherlands|Нидерланды)|🇵🇱\s(Poland|Польша)|🇷🇺\s(Russia|Россия)|🇸🇰\s(Slovakia|Словакия)|🇸🇮\s(Slovenia|Словения)|🇫🇮\s(Finland|Финляндия)|🇫🇷\s(France|Франция)|🇨🇿\s(Czech Republic|Чехия)|🇨🇭\s(Switzerland|Швейцария)|🇸🇪\s(Sweden|Швеция)|🇪🇪\s(Estonia|Эстония)))(?!.*(?i:torrent|LTE|YouTube|Обход|Белые)).*,policy-select-name=🟢 VPN
🤖 AI = select,use=true,🔴 Без VPN,🟢 VPN,policy-select-name=🟢 VPN
🍏 Apple = select,use=true,🔴 Без VPN,🟢 VPN,policy-select-name=🔴 Без VPN
🔍 Google = select,use=true,🔴 Без VPN,🟢 VPN,policy-select-name=🔴 Без VPN
🇷🇺 RU Сайты = select,use=true,🔴 Без VPN,policy-regex-filter=((🇷🇺\s(Russia|Россия)),policy-select-name=🔴 Без VPN
🌎 Остальной интернет = select,use=true,🔴 Без VPN,🟢 VPN,policy-select-name=🟢 VPN
🔴 Без VPN = select,use=true,DIRECT,policy-select-name=DIRECT,hidden=1

